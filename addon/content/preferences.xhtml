<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-mode"
      data-l10n-id="pref-mode"
    ></html:label>
    <menulist id="zotero-prefpane-__addonRef__-mode">
      <menupopup>
        <menuitem value="local" data-l10n-id="pref-mode-local" />
        <menuitem value="remote" data-l10n-id="pref-mode-remote" />
      </menupopup>
    </menulist>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-url"
      data-l10n-id="pref-url"
    ></html:label>
    <html:input type="url" id="zotero-prefpane-__addonRef__-url" size="55" />
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-token"
      data-l10n-id="pref-token"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-token"
      size="40"
    />
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-timeout"
      data-l10n-id="pref-timeout"
    ></html:label>
    <html:input
      type="number"
      id="zotero-prefpane-__addonRef__-timeout"
      min="1000"
      step="1000"
    />
  </hbox>
  <button id="zotero-prefpane-__addonRef__-health" data-l10n-id="pref-health" />
  <html:p data-l10n-id="pref-privacy"></html:p>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
